name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_mac:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Files & Mac Icon
        run: |
          MAIN_FILE=$(find . -maxdepth 3 -name "main.js" | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            MAIN_DIR=$(dirname "$MAIN_FILE")
            if [ "$MAIN_DIR" != "." ]; then
              cp -R "$MAIN_DIR"/* . || true
            fi
          fi

          rm -f package-lock.json
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "mydesigns-pro",
              version: "1.0.0",
              description: "MyDesigns Pro Tool",
              author: "Md Asaduzzaman Babu",
              main: "main.js",
              devDependencies: {
                "electron": "30.5.1",
                "@electron/packager": "^18.3.6"
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          if [ -f icon.png ]; then
            mkdir -p MyIcon.iconset
            sips -s format png -z 16 16     icon.png --out MyIcon.iconset/icon_16x16.png || true
            sips -s format png -z 32 32     icon.png --out MyIcon.iconset/icon_16x16@2x.png || true
            sips -s format png -z 32 32     icon.png --out MyIcon.iconset/icon_32x32.png || true
            sips -s format png -z 64 64     icon.png --out MyIcon.iconset/icon_32x32@2x.png || true
            sips -s format png -z 128 128   icon.png --out MyIcon.iconset/icon_128x128.png || true
            sips -s format png -z 256 256   icon.png --out MyIcon.iconset/icon_128x128@2x.png || true
            sips -s format png -z 256 256   icon.png --out MyIcon.iconset/icon_256x256.png || true
            sips -s format png -z 512 512   icon.png --out MyIcon.iconset/icon_256x256@2x.png || true
            sips -s format png -z 512 512   icon.png --out MyIcon.iconset/icon_512x512.png || true
            sips -s format png -z 1024 1024 icon.png --out MyIcon.iconset/icon_512x512@2x.png || true
            iconutil -c icns MyIcon.iconset -o app.icns || true
            rm -rf MyIcon.iconset
          fi

      - name: Install Official Electron Packager
        run: npm install

      - name: Package Mac Apps & Create DMG
        run: |
          ICON_FLAG=""
          if [ -f app.icns ]; then
            ICON_FLAG="--icon=app.icns"
          fi

          npx @electron/packager . "MyDesigns Pro Tool" --platform=darwin --arch=arm64 --out=dist --overwrite --ignore="^/(dist|out|dmg-)" $ICON_FLAG
          npx @electron/packager . "MyDesigns Pro Tool" --platform=darwin --arch=x64 --out=dist --overwrite --ignore="^/(dist|out|dmg-)" $ICON_FLAG

          codesign --force --deep --sign - "dist/MyDesigns Pro Tool-darwin-arm64/MyDesigns Pro Tool.app" || true
          codesign --force --deep --sign - "dist/MyDesigns Pro Tool-darwin-x64/MyDesigns Pro Tool.app" || true

          mkdir -p out dmg-arm64 dmg-intel

          ditto -c -k --sequesterRsrc --keepParent "dist/MyDesigns Pro Tool-darwin-arm64/MyDesigns Pro Tool.app" "out/MyDesigns-Pro-Tool-Mac-AppleSilicon.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/MyDesigns Pro Tool-darwin-x64/MyDesigns Pro Tool.app" "out/MyDesigns-Pro-Tool-Mac-Intel.zip"

          cp -R "dist/MyDesigns Pro Tool-darwin-arm64/MyDesigns Pro Tool.app" dmg-arm64/
          ln -s /Applications dmg-arm64/Applications
          hdiutil create -volname "MyDesigns Pro Tool" -srcfolder dmg-arm64 -ov -format UDZO "out/MyDesigns-Pro-Tool-Mac-AppleSilicon.dmg" || true

          cp -R "dist/MyDesigns Pro Tool-darwin-x64/MyDesigns Pro Tool.app" dmg-intel/
          ln -s /Applications dmg-intel/Applications
          hdiutil create -volname "MyDesigns Pro Tool" -srcfolder dmg-intel -ov -format UDZO "out/MyDesigns-Pro-Tool-Mac-Intel.dmg" || true

          ls -lh out/

      - name: Upload Mac Installers
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installers
          path: out/*

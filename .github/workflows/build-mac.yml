name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_mac:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-Fix package.json & Icon for macOS
        run: |
          rm -f package-lock.json
          npm pkg delete dependencies.puppeteer || true
          npm pkg set author="Md Asaduzzaman Babu"
          npm pkg set description="MyDesigns Pro Tool"
          if [ -f icon.png ]; then
            sips -s format png -z 512 512 icon.png --out icon.png || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Mac DMG & ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip --x64 --arm64 --config.mac.identity=null

      - name: Upload Mac Installers
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installers
          path: |
            dist/*.dmg
            dist/*.zip
